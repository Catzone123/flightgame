<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Dogfight</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Retro CRT Overlay */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        #health-bar-container {
            width: 200px;
            height: 16px;
            border: 2px solid #fff;
            margin-top: 10px;
            background: #222;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #00ff66;
            transition: width 0.1s;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 102, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff66;
            transform: translate(-50%, -50%);
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 10px;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border: 4px solid #ffffff;
            box-shadow: 10px 10px 0px #000;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 28px;
            color: #ff3333;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }

        #restart-btn {
            font-family: 'Press Start 2P', monospace;
            padding: 15px 25px;
            font-size: 12px;
            color: #000;
            background-color: #00ff66;
            border: 4px solid #ffffff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            margin-top: 20px;
        }

        #restart-btn:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="crt-overlay"></div>
    <div id="crosshair"></div>

    <div id="ui">
        <div>KILLS: <span id="score">0</span></div>
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>
    </div>

    <div id="controls-hint">MOUSE: FLY | CLICK / SPACE: SHOOT</div>

    <div id="game-over">
        <h1 id="over-title">SHOT DOWN!</h1>
        <p>ENEMIES DESTROYED: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">FLY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let player, playerPropeller;
        let enemies = [];
        let playerBullets = [];
        let enemyBullets = [];
        let particles = [];

        let score = 0;
        let playerHealth = 100;
        let isGameOver = false;

        let targetX = 0;
        let targetY = 0;
        let isShooting = false;
        let lastShootTime = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a68c9);
            scene.fog = new THREE.FogExp2(0x2a68c9, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            // Low resolution pixelated WebGL rendering
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(0.35); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 100, 50);
            scene.add(dirLight);

            // Terrain Grid
            const gridHelper = new THREE.GridHelper(800, 80, 0x00ff66, 0x004411);
            gridHelper.position.y = -20;
            scene.add(gridHelper);

            // Create Player Plane
            player = createPlane(0x00ff66, true);
            scene.add(player);

            // Controls
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', () => isShooting = true);
            document.addEventListener('mouseup', () => isShooting = false);
            document.addEventListener('keydown', (e) => { if (e.code === 'Space') isShooting = true; });
            document.addEventListener('keyup', (e) => { if (e.code === 'Space') isShooting = false; });
            window.addEventListener('resize', onWindowResize);

            // Spawn initial enemies
            for(let i = 0; i < 4; i++) {
                spawnEnemy();
            }
        }

        // Voxel/Pixel Style Airplane Mesh
        function createPlane(colorHex, isPlayer = false) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, flatShading: true });
            const wingMat = new THREE.MeshStandardMaterial({ color: isPlayer ? 0xffffff : 0x222222, flatShading: true });

            // Fuselage
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.5), bodyMat);
            group.add(body);

            // Wings
            const wing = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.1, 0.9), wingMat);
            wing.position.set(0, 0.1, 0.2);
            group.add(wing);

            // Tail
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), wingMat);
            tail.position.set(0, 0.5, -1.1);
            group.add(tail);

            return group;
        }

        function spawnEnemy() {
            const enemy = createPlane(0xff3333);
            enemy.position.set(
                (Math.random() - 0.5) * 80,
                Math.random() * 20 + 5,
                -100 - Math.random() * 50
            );
            enemy.userData = {
                health: 30,
                speed: 0.4 + Math.random() * 0.2,
                lastShot: 0
            };
            scene.add(enemy);
            enemies.push(enemy);
        }

        function shootBullet(isEnemy = false, sourceObj) {
            const mat = new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff0000 : 0xffff00 });
            const geo = new THREE.BoxGeometry(0.15, 0.15, 0.8);
            const bullet = new THREE.Mesh(geo, mat);

            if (!isEnemy) {
                bullet.position.copy(player.position);
                bullet.position.z -= 1.5;
                bullet.userData = { velocity: new THREE.Vector3(0, 0, -2) };
                playerBullets.push(bullet);
            } else {
                bullet.position.copy(sourceObj.position);
                const dir = new THREE.Vector3().subVectors(player.position, sourceObj.position).normalize();
                bullet.userData = { velocity: dir.multiplyScalar(1.2) };
                enemyBullets.push(bullet);
            }

            scene.add(bullet);
        }

        function createExplosion(pos) {
            for(let i = 0; i < 12; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.4, 0.4),
                    new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff9900 : 0xff3300 })
                );
                p.position.copy(pos);
                p.userData = {
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 0.8
                    ),
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function onMouseMove(event) {
            targetX = ((event.clientX - windowHalfX) / windowHalfX) * 12;
            targetY = -((event.clientY - windowHalfY) / windowHalfY) * 8;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updatePlayer() {
            player.position.x += (targetX - player.position.x) * 0.1;
            player.position.y += (targetY - player.position.y) * 0.1;

            player.rotation.z = -(targetX - player.position.x) * 0.2;
            player.rotation.x = (targetY - player.position.y) * 0.15;

            // Firing Logic
            const now = Date.now();
            if (isShooting && now - lastShootTime > 120) {
                shootBullet(false);
                lastShootTime = now;
            }
        }

        function updateEnemies() {
            const now = Date.now();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                // Simple Dogfight AI: Move towards player
                const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                enemy.position.add(dir.multiplyScalar(enemy.userData.speed));
                enemy.lookAt(player.position);

                // NPC Shooting AI
                if (enemy.position.distanceTo(player.position) < 80 && now - enemy.userData.lastShot > 1500) {
                    shootBullet(true, enemy);
                    enemy.userData.lastShot = now + Math.random() * 500;
                }

                // Respawn enemy if passed player
                if (enemy.position.z > camera.position.z + 10) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    spawnEnemy();
                }
            }
        }

        function updateProjectiles() {
            // Player Bullets
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                b.position.add(b.userData.velocity);

                // Check collision with Enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (b.position.distanceTo(enemy.position) < 2.0) {
                        enemy.userData.health -= 10;
                        createExplosion(b.position);
                        scene.remove(b);
                        playerBullets.splice(i, 1);

                        if (enemy.userData.health <= 0) {
                            createExplosion(enemy.position);
                            scene.remove(enemy);
                            enemies.splice(j, 1);
                            score++;
                            document.getElementById('score').innerText = score;
                            spawnEnemy();
                        }
                        break;
                    }
                }

                if (b && b.position.z < -150) {
                    scene.remove(b);
                    playerBullets.splice(i, 1);
                }
            }

            // Enemy Bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.position.add(b.userData.velocity);

                // Hit Player
                if (b.position.distanceTo(player.position) < 1.5) {
                    playerHealth -= 10;
                    document.getElementById('health-bar').style.width = Math.max(0, playerHealth) + '%';
                    createExplosion(b.position);
                    scene.remove(b);
                    enemyBullets.splice(i, 1);

                    if (playerHealth <= 0) {
                        triggerGameOver();
                    }
                    continue;
                }

                if (b.position.z > camera.position.z + 10) {
                    scene.remove(b);
                    enemyBullets.splice(i, 1);
                }
            }

            // Explosions Particle animation
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life -= 0.05;
                p.scale.multiplyScalar(0.9);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            // Clean active objects
            [...enemies, ...playerBullets, ...enemyBullets, ...particles].forEach(obj => scene.remove(obj));
            enemies = [];
            playerBullets = [];
            enemyBullets = [];
            particles = [];

            score = 0;
            playerHealth = 100;
            isGameOver = false;

            document.getElementById('score').innerText = '0';
            document.getElementById('health-bar').style.width = '100%';
            document.getElementById('game-over').style.display = 'none';

            player.position.set(0, 0, 0);
            for(let i = 0; i < 4; i++) spawnEnemy();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updatePlayer();
                updateEnemies();
                updateProjectiles();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
