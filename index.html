<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=24.34">
    <title>3D Flight Flight Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #1a1a1a;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #game-over h1 {
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 10px;
        }
        #game-over p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        #restart-btn {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #2ed573;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="ui">Score: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <!-- Include Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let airplane, propeller;
        let obstacles = [];
        let score = 0;
        let isGameOver = false;

        // Target plane orientation based on mouse move
        let targetX = 0;
        let targetY = 0;

        // Mouse sensitivity boundary
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xcce0ff);
            scene.fog = new THREE.FogExp2(0xcce0ff, 0.015);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 10);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 4. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Create Objects
            createAirplane();

            // 6. Event listeners
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('resize', onWindowResize);
        }

        function createAirplane() {
            const planeGroup = new THREE.Group();

            // Fuselage (Body)
            const bodyGeo = new THREE.ConeGeometry(0.6, 3, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeb4d4b, flatShading: true });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            planeGroup.add(body);

            // Wings
            const wingGeo = new THREE.BoxGeometry(5, 0.1, 1);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xf0932b, flatShading: true });
            const wing = new THREE.Mesh(wingGeo, wingMat);
            wing.position.set(0, 0, 0.2);
            planeGroup.add(wing);

            // Tail Fin
            const tailGeo = new THREE.BoxGeometry(0.1, 0.8, 0.8);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 0.5, -1.2);
            planeGroup.add(tail);

            // Propeller
            const propGeo = new THREE.BoxGeometry(1.2, 0.1, 0.05);
            const propMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            propeller = new THREE.Mesh(propGeo, propMat);
            propeller.position.set(0, 0, 1.5);
            planeGroup.add(propeller);

            airplane = planeGroup;
            scene.add(airplane);
        }

        function createObstacle() {
            const size = Math.random() * 1.5 + 1;
            const geo = new THREE.DodecahedronGeometry(size, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x6c5ce7, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);

            // Position obstacle ahead of the plane with slight random variation
            mesh.position.x = (Math.random() - 0.5) * 20;
            mesh.position.y = (Math.random() - 0.5) * 12;
            mesh.position.z = -100;

            // Give it random rotation speeds
            mesh.userData = {
                rotX: (Math.random() - 0.5) * 0.05,
                rotY: (Math.random() - 0.5) * 0.05
            };

            scene.add(mesh);
            obstacles.push(mesh);
        }

        function onMouseMove(event) {
            targetX = ((event.clientX - windowHalfX) / windowHalfX) * 8;
            targetY = -((event.clientY - windowHalfY) / windowHalfY) * 5;
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                targetX = ((event.touches[0].clientX - windowHalfX) / windowHalfX) * 8;
                targetY = -((event.touches[0].clientY - windowHalfY) / windowHalfY) * 5;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateAirplane() {
            // Smooth motion (lerp) toward target position
            airplane.position.x += (targetX - airplane.position.x) * 0.1;
            airplane.position.y += (targetY - airplane.position.y) * 0.1;

            // Bank/tilt plane dynamically based on movement
            airplane.rotation.z = -(targetX - airplane.position.x) * 0.3;
            airplane.rotation.x = (targetY - airplane.position.y) * 0.2;

            // Spin propeller
            propeller.rotation.z += 0.4;
        }

        function updateObstacles() {
            // Spawn obstacles
            if (Math.random() < 0.05) {
                createObstacle();
            }

            const speed = 0.8 + score * 0.005; // Gradually speeds up

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                // Rotate obstacle
                obs.rotation.x += obs.userData.rotX;
                obs.rotation.y += obs.userData.rotY;

                // Collision detection via distance check
                const dist = airplane.position.distanceTo(obs.position);
                if (dist < 1.8) {
                    triggerGameOver();
                }

                // Remove offscreen obstacles and add score
                if (obs.position.z > camera.position.z) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            // Clear existing obstacles
            for (let obs of obstacles) {
                scene.remove(obs);
            }
            obstacles = [];

            // Reset stats
            score = 0;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';

            // Reset plane
            airplane.position.set(0, 0, 0);
            targetX = 0;
            targetY = 0;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updateAirplane();
                updateObstacles();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
