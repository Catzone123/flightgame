<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Dogfight - Enhanced Flight Sim</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* CRT Filter */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* Top Bar UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 14px;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        #health-bar-container {
            width: 180px;
            height: 14px;
            border: 2px solid #fff;
            margin-top: 8px;
            background: #222;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #00ff66;
            transition: width 0.1s;
        }

        /* Flight HUD Instrument Panel */
        #hud-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 3px solid #555;
            padding: 12px;
            color: #00ff66;
            font-size: 10px;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            box-shadow: 4px 4px 0px #000;
        }

        .gauge-box {
            border: 1px solid #00ff66;
            padding: 6px;
            background: #111;
        }

        .gauge-title {
            color: #aaa;
            font-size: 8px;
            margin-bottom: 4px;
        }

        .gauge-value {
            font-size: 12px;
            color: #fff;
        }

        .engine-on { color: #00ff66 !important; }
        .engine-off { color: #ff3333 !important; }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 102, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff66;
            transform: translate(-50%, -50%);
        }

        #controls-hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #aaa;
            font-size: 9px;
            text-align: right;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border: 4px solid #ffffff;
            box-shadow: 10px 10px 0px #000;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 28px;
            color: #ff3333;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }

        #restart-btn {
            font-family: 'Press Start 2P', monospace;
            padding: 15px 25px;
            font-size: 12px;
            color: #000;
            background-color: #00ff66;
            border: 4px solid #ffffff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            margin-top: 20px;
        }

        #restart-btn:hover { background-color: #00cc52; }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="crt-overlay"></div>
    <div id="crosshair"></div>

    <div id="ui">
        <div>KILLS: <span id="score">0</span></div>
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>
    </div>

    <!-- HUD Instrument Panel -->
    <div id="hud-panel">
        <div class="gauge-box">
            <div class="gauge-title">ENGINE [E]</div>
            <div id="hud-engine" class="gauge-value engine-on">ON</div>
        </div>
        <div class="gauge-box">
            <div class="gauge-title">SPEED</div>
            <div id="hud-speed" class="gauge-value">120 SPD</div>
        </div>
        <div class="gauge-box">
            <div class="gauge-title">ALTITUDE</div>
            <div id="hud-alt" class="gauge-value">250 FT</div>
        </div>
        <div class="gauge-box">
            <div class="gauge-title">TIME</div>
            <div id="hud-time" class="gauge-value">DAY</div>
        </div>
    </div>

    <div id="controls-hint">
        WASD / ARROWS: PITCH & ROLL<br>
        W / S: THROTTLE SPEED<br>
        E: TOGGLE ENGINE ON/OFF<br>
        SPACE: FIRING CANNON
    </div>

    <div id="game-over">
        <h1 id="over-title">CRASHED!</h1>
        <p>ENEMIES DESTROYED: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">FLY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let player, playerPropeller;
        let enemies = [];
        let playerBullets = [];
        let enemyBullets = [];
        let particles = [];
        let sunLight, ambientLight;

        let score = 0;
        let playerHealth = 100;
        let isGameOver = false;

        // Flight Physics Variables
        let speed = 0.5;
        let maxSpeed = 0.9;
        let minSpeed = 0.1;
        let isEngineOn = true;
        let pitch = 0, roll = 0, yaw = 0;

        // Key states
        const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };

        // Day/Night Cycle Variable
        let dayTime = 0; // 0 to 2PI

        // Web Audio Procedural Sound Engine
        let audioCtx, engineOsc, engineGain;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

            engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function updateAudio() {
            if (!audioCtx) return;
            if (isEngineOn && !isGameOver) {
                engineGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
                engineOsc.frequency.setTargetAtTime(40 + speed * 120, audioCtx.currentTime, 0.1);
            } else {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
            }
        }

        // Texture Generator
        function generatePixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    let noise = (Math.random() - 0.5) * 30;
                    if (type === 'grass') ctx.fillStyle = `rgb(${40 + noise}, ${150 + noise}, ${40 + noise})`;
                    else if (type === 'wood') ctx.fillStyle = `rgb(${160 + noise}, ${110 + noise}, ${60 + noise})`;
                    else if (type === 'red_wool') ctx.fillStyle = `rgb(${180 + noise}, ${30 + noise}, ${30 + noise})`;
                    else if (type === 'obsidian') ctx.fillStyle = `rgb(${30 + noise}, ${20 + noise}, ${40 + noise})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const textures = {};

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(0.35); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            textures.grass = generatePixelTexture('grass');
            textures.wood = generatePixelTexture('wood');
            textures.red = generatePixelTexture('red_wool');
            textures.obsidian = generatePixelTexture('obsidian');

            // Lighting Setup for Day/Night Cycle
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(0, 100, 0);
            scene.add(sunLight);

            createBlockyTerrain();

            player = createPlane(textures.wood, textures.grass, true);
            scene.add(player);

            // Controls
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            for(let i = 0; i < 4; i++) spawnEnemy();
        }

        function createBlockyTerrain() {
            const groundGroup = new THREE.Group();
            const geo = new THREE.BoxGeometry(6, 6, 6);
            const mat = new THREE.MeshStandardMaterial({ map: textures.grass, flatShading: true });

            for(let x = -120; x <= 120; x += 6) {
                for(let z = -250; z <= 100; z += 6) {
                    const block = new THREE.Mesh(geo, mat);
                    block.position.set(x, -25, z);
                    groundGroup.add(block);
                }
            }
            scene.add(groundGroup);
        }

        function createPlane(bodyTex, wingTex, isPlayer = false) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ map: bodyTex, flatShading: true });
            const wingMat = new THREE.MeshStandardMaterial({ map: wingTex, flatShading: true });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.5), bodyMat);
            group.add(body);

            const wing = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.15, 0.9), wingMat);
            wing.position.set(0, 0.1, 0.2);
            group.add(wing);

            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.8, 0.6), wingMat);
            tail.position.set(0, 0.5, -1.1);
            group.add(tail);

            if (isPlayer) {
                const propGeo = new THREE.BoxGeometry(1.4, 0.15, 0.05);
                const propMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                playerPropeller = new THREE.Mesh(propGeo, propMat);
                playerPropeller.position.set(0, 0, 1.3);
                group.add(playerPropeller);
            }

            return group;
        }

        function spawnEnemy() {
            const enemy = createPlane(textures.red, textures.obsidian);
            enemy.position.set(
                (Math.random() - 0.5) * 80,
                Math.random() * 20 + 5,
                -100 - Math.random() * 50
            );
            enemy.userData = { health: 30, speed: 0.35 + Math.random() * 0.2, lastShot: 0 };
            scene.add(enemy);
            enemies.push(enemy);
        }

        function onKeyDown(e) {
            initAudio();
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;

            // Toggle Engine Key [E]
            if (e.code === 'KeyE') {
                isEngineOn = !isEngineOn;
                const engineHUD = document.getElementById('hud-engine');
                engineHUD.innerText = isEngineOn ? 'ON' : 'OFF';
                engineHUD.className = 'gauge-value ' + (isEngineOn ? 'engine-on' : 'engine-off');
            }
        }

        function onKeyUp(e) {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let lastShootTime = 0;

        function updatePlayer() {
            // Engine Thrust and Glide Mechanics
            if (isEngineOn) {
                if (keys.KeyW || keys.ArrowUp) speed = Math.min(maxSpeed, speed + 0.01);
                if (keys.KeyS || keys.ArrowDown) speed = Math.max(minSpeed, speed - 0.01);
                playerPropeller.rotation.z += speed * 2;
            } else {
                speed = Math.max(0, speed - 0.005); // Glide deceleration
                player.position.y -= 0.08; // Gravity drop when engine is off
            }

            // Keyboard Direction Controls
            if (keys.KeyA || keys.ArrowLeft) roll = Math.min(0.6, roll + 0.05);
            else if (keys.KeyD || keys.ArrowRight) roll = Math.max(-0.6, roll - 0.05);
            else roll *= 0.9;

            if (keys.KeyW || keys.ArrowUp) pitch = Math.max(-0.4, pitch - 0.04);
            else if (keys.KeyS || keys.ArrowDown) pitch = Math.min(0.4, pitch + 0.04);
            else pitch *= 0.9;

            player.position.x -= roll * 0.4 * (speed + 0.2);
            player.position.y += pitch * 0.3 * (speed + 0.2);

            player.rotation.z = roll;
            player.rotation.x = pitch;

            // Ground Crash Check
            if (player.position.y < -20) {
                triggerGameOver("CRASHED INTO TERRAIN!");
            }

            // Firing Cannon
            const now = Date.now();
            if (keys.Space && now - lastShootTime > 120) {
                shootBullet(false);
                lastShootTime = now;
            }

            // HUD Gauges Update
            document.getElementById('hud-speed').innerText = Math.round(speed * 200) + ' SPD';
            document.getElementById('hud-alt').innerText = Math.round((player.position.y + 25) * 10) + ' FT';
        }

        function shootBullet(isEnemy = false, sourceObj) {
            const mat = new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff0000 : 0xffff00 });
            const geo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
            const bullet = new THREE.Mesh(geo, mat);

            if (!isEnemy) {
                bullet.position.copy(player.position);
                bullet.position.z -= 1.5;
                bullet.userData = { velocity: new THREE.Vector3(0, pitch * 0.5, -2 - speed) };
                playerBullets.push(bullet);
            } else {
                bullet.position.copy(sourceObj.position);
                const dir = new THREE.Vector3().subVectors(player.position, sourceObj.position).normalize();
                bullet.userData = { velocity: dir.multiplyScalar(1.2) };
                enemyBullets.push(bullet);
            }
            scene.add(bullet);
        }

        function updateDayNightCycle() {
            dayTime += 0.0005; // Cycle progression rate
            
            const sunY = Math.sin(dayTime);
            const sunZ = Math.cos(dayTime);
            sunLight.position.set(0, sunY * 100, sunZ * 100);

            // Sky Color interpolation
            if (sunY > 0) {
                // Day Time
                scene.background.setHSL(0.58, 0.7, 0.5 * sunY + 0.2);
                scene.fog.color.setHSL(0.58, 0.7, 0.5 * sunY + 0.2);
                ambientLight.intensity = Math.max(0.3, sunY * 0.8);
                document.getElementById('hud-time').innerText = "DAY";
            } else {
                // Night Time
                scene.background.setHSL(0.65, 0.8, 0.05);
                scene.fog.color.setHSL(0.65, 0.8, 0.05);
                ambientLight.intensity = 0.15;
                document.getElementById('hud-time').innerText = "NIGHT";
            }
        }

        function updateEnemies() {
            const now = Date.now();
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                enemy.position.add(dir.multiplyScalar(enemy.userData.speed));
                enemy.lookAt(player.position);

                if (enemy.position.distanceTo(player.position) < 80 && now - enemy.userData.lastShot > 1600) {
                    shootBullet(true, enemy);
                    enemy.userData.lastShot = now;
                }

                if (enemy.position.z > camera.position.z + 10) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    spawnEnemy();
                }
            }
        }

        function updateProjectiles() {
            // Player Bullets
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                b.position.add(b.userData.velocity);

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (b.position.distanceTo(enemy.position) < 2.0) {
                        enemy.userData.health -= 10;
                        createExplosion(b.position);
                        scene.remove(b);
                        playerBullets.splice(i, 1);

                        if (enemy.userData.health <= 0) {
                            createExplosion(enemy.position);
                            scene.remove(enemy);
                            enemies.splice(j, 1);
                            score++;
                            document.getElementById('score').innerText = score;
                            spawnEnemy();
                        }
                        break;
                    }
                }

                if (b && b.position.z < -160) {
                    scene.remove(b);
                    playerBullets.splice(i, 1);
                }
            }

            // Enemy Bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.position.add(b.userData.velocity);

                if (b.position.distanceTo(player.position) < 1.5) {
                    playerHealth -= 10;
                    document.getElementById('health-bar').style.width = Math.max(0, playerHealth) + '%';
                    createExplosion(b.position);
                    scene.remove(b);
                    enemyBullets.splice(i, 1);

                    if (playerHealth <= 0) {
                        triggerGameOver("SHOT DOWN!");
                    }
                    continue;
                }

                if (b.position.z > camera.position.z + 10) {
                    scene.remove(b);
                    enemyBullets.splice(i, 1);
                }
            }

            // Particle Explosions
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life -= 0.05;
                p.scale.multiplyScalar(0.9);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function createExplosion(pos) {
            for(let i = 0; i < 12; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.4, 0.4),
                    new THREE.MeshStandardMaterial({ map: textures.red })
                );
                p.position.copy(pos);
                p.userData = {
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 0.8
                    ),
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function triggerGameOver(reason = "SHOT DOWN!") {
            isGameOver = true;
            document.getElementById('over-title').innerText = reason;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            [...enemies, ...playerBullets, ...enemyBullets, ...particles].forEach(obj => scene.remove(obj));
            enemies = [];
            playerBullets = [];
            enemyBullets = [];
            particles = [];

            score = 0;
            playerHealth = 100;
            speed = 0.5;
            isEngineOn = true;
            isGameOver = false;

            document.getElementById('hud-engine').innerText = 'ON';
            document.getElementById('hud-engine').className = 'gauge-value engine-on';
            document.getElementById('score').innerText = '0';
            document.getElementById('health-bar').style.width = '100%';
            document.getElementById('game-over').style.display = 'none';

            player.position.set(0, 0, 0);
            for(let i = 0; i < 4; i++) spawnEnemy();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updatePlayer();
                updateDayNightCycle();
                updateEnemies();
                updateProjectiles();
                updateAudio();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
